# Reproducible, audit-pinned build. Every setting that affects the produced bytecode is
# explicit here so an auditor or Arbiscan can reproduce the artifact byte-for-byte.
[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"

solc_version = "0.8.28"
evm_version = "shanghai"   # PUSH0; supported on Arbitrum One since ArbOS 11 (2023)
optimizer = true
optimizer_runs = 200           # balances deploy size against long-lived runtime gas
via_ir = true

# Treat compiler warnings as signal, not noise.
deny_warnings = false
gas_reports = ["BeeHabitatDAO"]

[profile.ci]
via_ir = true
fuzz = { runs = 2048 }
verbosity = 2

# Deep fuzzing for pre-deployment sign-off: `forge test --profile audit`
[profile.audit]
via_ir = true
fuzz = { runs = 20000 }
